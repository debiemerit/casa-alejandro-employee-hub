{% extends "base.html" %}{% block content %}<h1>Restaurant GPS Geofence</h1><p>Set coordinates using the restaurant's exact map pin. GPS can be spoofed; manual review is required for exceptions.</p><form method="post"><input type="hidden" name="csrf" value="{{csrf}}">{% for k in ['lat','lng','radius','accuracy'] %}<label>{{k}} <input name="{{k}}" type="number" step="any" required value="{{settings.get({'lat':'geofence_lat','lng':'geofence_lng','radius':'geofence_radius','accuracy':'gps_max_accuracy'}[k])}}"></label>{% endfor %}<label>Outside area <select name="policy"><option value="review">Flag for review</option><option value="block">Block</option></select></label><button>Save Geofence</button></form>{% endblock %}
