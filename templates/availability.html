{% extends "base.html" %}{% block content %}<h1>My Availability</h1><form method="post"><input type="hidden" name="csrf" value="{{csrf}}"><label>Date <input type="date" name="day" required></label><label>Available? <select name="available"><option value="yes">Yes</option><option value="no">No</option></select></label><label>Notes <input name="note"></label><button>Save</button></form><h2>Submitted dates</h2>{% for r in rows %}<p>{{r.day}} — {{'Available' if r.available else 'Unavailable'}} — {{r.note}}</p>{% endfor %}{% endblock %}
