{% extends 'base.html' %}{% block content %}<h1>Employees</h1><section class="card"><h2>Add employee</h2><form method="post" class="formgrid"><input type="hidden" name="csrf" value="{{csrf}}"><label>Full name<input name="name" required></label><label>Username<input name="username" required></label><label>Initial password (12+ chars)<input name="password" type="password" minlength="12" required></label><label>Position<input name="position" value="Staff"></label><label>Daily rate PHP<input name="daily_rate" type="number" min="0" step="0.01" value="0"></label><label>Role<select name="role"><option>employee</option><option>manager</option><option>admin</option></select></label><label>Rest day <select name="rest_weekday"><option value="6">Sunday</option><option value="0">Monday</option><option value="1">Tuesday</option><option value="2">Wednesday</option><option value="3">Thursday</option><option value="4">Friday</option><option value="5">Saturday</option></select></label><button>Create account</button></form></section><section class="card"><h2>Accounts</h2>{% for u in employees %}<div class="item"><div><b>{{u.name}}</b><small>{{u.username}} · {{u.role}} · PHP {{money(u.daily_rate)}} / day · {{'Active' if u.active else 'Inactive'}}</small></div><div><form method="post" action="/employees/{{u.id}}/password" class="inline"><input type="hidden" name="csrf" value="{{csrf}}"><input type="password" name="password" minlength="12" placeholder="New password" required><button>Reset</button></form>{% if u.id!=me.id %}<form method="post" action="/employees/{{u.id}}/status"><input type="hidden" name="csrf" value="{{csrf}}"><button class="secondary">{{'Deactivate' if u.active else 'Activate'}}</button></form>{% endif %}</div></div>{% endfor %}</section>{% endblock %}
